<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1220" viewBox="0 0 1640 1220" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <style>
      .box { rx: 10; ry: 10; stroke-width: 2; }
      .t { font-size: 15px; fill: #1f2933; }
      .tb { font-size: 15px; font-weight: bold; fill: #1f2933; }
      .s { font-size: 13px; fill: #3e4c59; }
      .layer { font-size: 15px; font-weight: bold; fill: #52606d; letter-spacing: .5px; }
      .flow { stroke: #5b6b7c; stroke-width: 2; fill: none; }
      .flowr { stroke: #c0392b; stroke-width: 2.5; fill: none; }
      .chan { fill: #eceff1; stroke: #78909c; }
      .integ { fill: #ede7f6; stroke: #7e57c2; }
      .core { fill: #ffebee; stroke: #e57373; }
      .tools { fill: #e3f2fd; stroke: #42a5f5; }
      .dom { fill: #fff3e0; stroke: #ffa726; }
      .store { fill: #e8f5e9; stroke: #66bb6a; }
      .deliv { fill: #e0f2f1; stroke: #26a69a; }
      .ops { fill: #f3e5f5; stroke: #ab47bc; }
    </style>
  </defs>

  <rect width="1640" height="1220" fill="#ffffff"/>
  <text x="30" y="40" font-size="24" font-weight="bold" fill="#1f2933">Ассистент TenKrol — функции, сервисы и потоки данных</text>
  <text x="30" y="64" class="s">Прод: release-20261018-182341 · 951 тест · 30 сценариев приёмки · 10 доменных спек</text>

  <!-- Каналы -->
  <text x="30" y="105" class="layer">КАНАЛЫ</text>
  <rect class="box chan" x="30"  y="115" width="230" height="60"/><text x="48"  y="142" class="tb">Telegram</text><text x="48" y="162" class="s">@Tenkrol_bot</text>
  <rect class="box chan" x="280" y="115" width="200" height="60"/><text x="298" y="142" class="tb">VK</text><text x="298" y="162" class="s">сообщество</text>
  <rect class="box chan" x="500" y="115" width="180" height="60"/><text x="518" y="142" class="tb">VK Teams</text>
  <rect class="box chan" x="700" y="115" width="160" height="60"/><text x="718" y="142" class="tb">MAX</text>
  <rect class="box chan" x="880" y="115" width="220" height="60"/><text x="898" y="142" class="tb">Мини-приложение</text><text x="898" y="162" class="s">/app · RU/EN</text>
  <rect class="box chan" x="1120" y="115" width="230" height="60"/><text x="1138" y="142" class="tb">Агент</text><text x="1138" y="162" class="s">Финляндия · длинные задачи</text>
  <rect class="box chan" x="1370" y="115" width="240" height="60"/><text x="1388" y="142" class="tb">Владелец / Мария</text><text x="1388" y="162" class="s">напоминания, обзор, отчёты</text>

  <!-- Интеграции платформ -->
  <rect class="box integ" x="30" y="205" width="440" height="60"/><text x="48" y="232" class="tb">integrations/platforms</text><text x="48" y="252" class="s">порт платформы + адаптеры (sendText, sendFile, sendVoice, документы)</text>

  <!-- Ядро -->
  <text x="500" y="205" class="layer">ЯДРО</text>
  <rect class="box core" x="500" y="215" width="300" height="70"/><text x="518" y="242" class="tb">core/conversation</text><text x="518" y="262" class="s">конвейер: доступ → контекст и память →</text><text x="518" y="278" class="s">модель и инструменты → ответ и действия</text>
  <rect class="box core" x="820" y="215" width="250" height="70"/><text x="838" y="242" class="tb">core/commands</text><text x="838" y="262" class="s">маршрутизатор /...</text><text x="838" y="278" class="s">/memory /project /export /app …</text>
  <rect class="box core" x="1090" y="215" width="250" height="70"/><text x="1108" y="242" class="tb">core/access + projects</text><text x="1108" y="262" class="s">роли, области, приглашения</text><text x="1108" y="278" class="s">owner / editor / viewer</text>
  <rect class="box core" x="1360" y="215" width="250" height="70"/><text x="1378" y="242" class="tb">proactive</text><text x="1378" y="262" class="s">обзор, бюджет 3+1, тихие часы</text><text x="1378" y="278" class="s">персональные настройки</text>

  <!-- Инструменты -->
  <text x="30" y="310" class="layer">ИНСТРУМЕНТЫ МОДЕЛИ</text>
  <rect class="box tools" x="30" y="320" width="740" height="90"/>
  <text x="48" y="347" class="tb">tools/registry — единый контракт definition + executeDetailed, реестр в одном месте</text>
  <text x="48" y="372" class="s">remind · remember · file · event · poll · documents · sendto · find_history · server · youtube</text>
  <text x="48" y="394" class="s">плюс web_search, web_fetch, weather, holidays, joke, home — сеть только через integrations</text>
  <rect class="box tools" x="790" y="320" width="330" height="90"/>
  <text x="808" y="347" class="tb">Модель DeepSeek</text>
  <text x="808" y="372" class="s">диалог, инструменты, ранжирование</text>
  <text x="808" y="394" class="s">поиска по документам</text>
  <rect class="box integ" x="1140" y="320" width="470" height="90"/>
  <text x="1158" y="347" class="tb">integrations</text>
  <text x="1158" y="372" class="s">Yandex-речь (STT/TTS) · погода · YouTube · web · умный дом</text>
  <text x="1158" y="394" class="s">шутки · праздники · мост агента · общий помощник таймаутов и ошибок</text>

  <!-- Домены -->
  <text x="30" y="455" class="layer">ПРАВИЛА (ДОМЕН)</text>
  <rect class="box dom" x="30" y="465" width="330" height="80"/><text x="48" y="492" class="tb">profiles + memory</text><text x="48" y="514" class="s">факты с источником, областью,</text><text x="48" y="532" class="s">статусом, сроком; tombstone</text>
  <rect class="box dom" x="380" y="465" width="290" height="80"/><text x="398" y="492" class="tb">reminders</text><text x="398" y="514" class="s">пояс пользователя, повторы,</text><text x="398" y="532" class="s">тихие часы, закрытие прошлого</text>
  <rect class="box dom" x="690" y="465" width="230" height="80"/><text x="708" y="492" class="tb">events</text><text x="708" y="514" class="s">годовой повтор,</text><text x="708" y="532" class="s">напоминание за N минут</text>
  <rect class="box dom" x="940" y="465" width="230" height="80"/><text x="958" y="492" class="tb">polls</text><text x="958" y="514" class="s">один голос, закрытый</text><text x="958" y="532" class="s">опрос не принимает</text>
  <rect class="box dom" x="1190" y="465" width="420" height="80"/><text x="1208" y="492" class="tb">documents</text><text x="1208" y="514" class="s">приём и индекс PDF/DOCX/XLSX, цитаты с фрагментом</text><text x="1208" y="532" class="s">и страницей, версии, каскадное удаление</text>

  <!-- Хранение -->
  <text x="30" y="590" class="layer">ХРАНЕНИЕ</text>
  <rect class="box store" x="30" y="600" width="700" height="80"/>
  <text x="48" y="627" class="tb">storage/json-store — атомарная запись, один писатель, версии схемы и миграции</text>
  <text x="48" y="650" class="s">/var/lib/tg-agent: reminders · events · polls · profiles · history · contacts · scopes</text>
  <text x="48" y="670" class="s">documents · proactive · usage · offset — 15+ файлов, копии перед миграциями</text>
  <rect class="box ops" x="760" y="600" width="380" height="80"/>
  <text x="778" y="627" class="tb">Бэкапы и наблюдение</text>
  <text x="778" y="650" class="s">Telegram-бэкап состояния · Яндекс.Диск</text>
  <text x="778" y="670" class="s">сторож диска · watchdog задач · журналы</text>
  <rect class="box deliv" x="1170" y="600" width="440" height="80"/>
  <text x="1188" y="627" class="tb">delivery/format + stream</text>
  <text x="1188" y="650" class="s">разметка под платформу, экранирование,</text>
  <text x="1188" y="670" class="s">стриминг и разбиение длинных ответов</text>

  <!-- Стрелки -->
  <path class="flow" d="M 250 175 L 250 205" marker-end="url(#arrow)"/>
  <path class="flow" d="M 380 175 L 380 205" marker-end="url(#arrow)"/>
  <path class="flow" d="M 590 175 L 590 205" marker-end="url(#arrow)"/>
  <path class="flow" d="M 780 175 L 780 205" marker-end="url(#arrow)"/>
  <path class="flow" d="M 990 175 L 990 205" marker-end="url(#arrow)"/>
  <path class="flow" d="M 1235 175 L 1235 205" marker-end="url(#arrow)"/>
  <path class="flow" d="M 470 235 L 500 235" marker-end="url(#arrow)"/>
  <path class="flow" d="M 800 235 L 820 235" marker-end="url(#arrow)"/>
  <path class="flow" d="M 1070 235 L 1090 235" marker-end="url(#arrow)"/>
  <path class="flow" d="M 1340 235 L 1360 235" marker-end="url(#arrow)"/>
  <path class="flow" d="M 650 285 L 650 320" marker-end="url(#arrow)"/>
  <path class="flow" d="M 945 285 L 945 320" marker-end="url(#arrow)"/>
  <path class="flow" d="M 1375 285 L 1375 320" marker-end="url(#arrow)"/>
  <path class="flow" d="M 400 410 L 400 465" marker-end="url(#arrow)"/>
  <path class="flow" d="M 1375 410 L 1375 465" marker-end="url(#arrow)"/>
  <path class="flow" d="M 380 545 L 380 600" marker-end="url(#arrow)"/>
  <path class="flow" d="M 805 545 L 805 600" marker-end="url(#arrow)"/>
  <path class="flow" d="M 1375 545 L 1375 600" marker-end="url(#arrow)"/>
  <!-- ответ обратно в канал -->
  <path class="flowr" d="M 1390 600 L 1390 285 Q 1390 275 1380 275 L 1740 275" />
  <path class="flowr" d="M 1500 275 L 1500 235" marker-end="url(#arrowRed)"/>
  <text x="1418" y="300" class="s" fill="#c0392b">ответ в канал</text>
  <!-- проактивность → delivery -->
  <path class="flow" d="M 1500 285 L 1500 600" marker-end="url(#arrow)"/>
  <text x="1508" y="450" class="s">обзор и уведомления</text>
  <!-- агент -->
  <path class="flow" d="M 1235 60 L 1235 115" marker-end="url(#arrow)"/>
  <text x="1244" y="90" class="s">мост: задачи, отчёты</text>

  <!-- Подписи потоков -->
  <text x="600" y="312" class="s">входящее сообщение</text>
  <text x="30" y="720" class="tb">Потоки:</text>
  <text x="30" y="744" class="s">1. Сообщение из канала → адаптер → конвейер → инструменты → домены → хранилище → ответ через delivery обратно в канал.</text>
  <text x="30" y="766" class="s">2. Модель вызывает инструменты; сеть у них только через integrations (timeout, единый тип ошибки).</text>
  <text x="30" y="788" class="s">3. Проактивность идёт по тому же планировщику и доставляет через delivery; у каждого человека свои настройки и лимиты.</text>
  <text x="30" y="810" class="s">4. Агент на Финляндии получает длинные задачи через мост, его отчёт возвращается в чат бота.</text>

  <!-- Легенда -->
  <text x="30" y="860" class="layer">ЛЕГЕНДА</text>
  <rect class="box chan" x="30" y="875" width="150" height="30"/><text x="42" y="896" class="s">каналы</text>
  <rect class="box integ" x="195" y="875" width="150" height="30"/><text x="207" y="896" class="s">внешние подключения</text>
  <rect class="box core" x="360" y="875" width="150" height="30"/><text x="372" y="896" class="s">ядро</text>
  <rect class="box tools" x="525" y="875" width="150" height="30"/><text x="537" y="896" class="s">инструменты и модель</text>
  <rect class="box dom" x="690" y="875" width="150" height="30"/><text x="702" y="896" class="s">правила домена</text>
  <rect class="box store" x="855" y="875" width="150" height="30"/><text x="867" y="896" class="s">хранение</text>
  <rect class="box deliv" x="1020" y="875" width="150" height="30"/><text x="1032" y="896" class="s">доставка</text>
  <rect class="box ops" x="1185" y="875" width="150" height="30"/><text x="1197" y="896" class="s">эксплуатация</text>
  <text x="30" y="940" class="s">Красная стрелка — ответ и доставка уведомлений в канал. Всё остальное — запросы и данные внутри бота.</text>
  <text x="30" y="962" class="s">Отдельно от схемы: процесс изменений (OpenSpec, папки PLB, приёмка) — не рантайм, см. AGENTS.md и docs/ACCEPTANCE-MATRIX.md.</text>
</svg>
